apiVersion: v1
kind: Service
metadata:
  name: noeriva-elasticsearch
spec:
  selector: {app.kubernetes.io/component: elasticsearch, noeriva.io/data-plane: 'true'}
  ports:
  - {name: http, port: 9200, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: noeriva-elasticsearch
spec:
  serviceName: noeriva-elasticsearch
  replicas: 1
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/component: elasticsearch, noeriva.io/data-plane: 'true'}
  template:
    metadata:
      labels: {app.kubernetes.io/name: noeriva-data, app.kubernetes.io/part-of: noeriva, app.kubernetes.io/component: elasticsearch, noeriva.io/data-plane: 'true'}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {noeriva.io/data-plane: 'true'}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
        imagePullPolicy: IfNotPresent
        env:
        - {name: discovery.type, value: single-node}
        - {name: cluster.name, value: noeriva-search}
        - {name: xpack.security.enabled, value: 'true'}
        - {name: xpack.security.http.ssl.enabled, value: 'false'}
        - {name: xpack.security.transport.ssl.enabled, value: 'false'}
        # The data node CPU has no AVX2. Entity search needs no native ML process.
        - {name: xpack.ml.enabled, value: 'false'}
        - {name: node.store.allow_mmap, value: 'false'}
        - {name: ES_JAVA_OPTS, value: '-Xms512m -Xmx512m'}
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef: {name: noeriva-runtime, key: NOERIVA_ELASTICSEARCH_PASSWORD}
        ports: [{name: http, containerPort: 9200}]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: '2', memory: 2Gi}
        volumeMounts: [{name: data, mountPath: /usr/share/elasticsearch/data}]
        startupProbe:
          tcpSocket: {port: http}
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          exec:
            command: [bash, -ec, 'curl -fsS --max-time 4 -u "elastic:$ELASTIC_PASSWORD" "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s" >/dev/null']
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket: {port: http}
          periodSeconds: 20
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources: {requests: {storage: 20Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: noeriva-data-elasticsearch
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: elasticsearch, noeriva.io/data-plane: 'true'}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: noeriva}
        matchExpressions:
        - {key: app.kubernetes.io/component, operator: In, values: [control, worker]}
    ports: [{protocol: TCP, port: 9200}]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
