apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: noeriva-data-mysql
  namespace: noeriva-system
spec:
  podSelector:
    matchLabels:
      noeriva.io/data-plane: 'true'
      app.kubernetes.io/component: mysql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: noeriva
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - control
          - worker
    ports:
    - protocol: TCP
      port: 3306
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
