apiVersion: v1
kind: Service
metadata:
  name: noeriva-mysql
  namespace: noeriva-system
  labels:
    app.kubernetes.io/name: noeriva-data
    app.kubernetes.io/part-of: noeriva
    app.kubernetes.io/component: mysql
    noeriva.io/data-plane: 'true'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: noeriva-data
    app.kubernetes.io/part-of: noeriva
    app.kubernetes.io/component: mysql
    noeriva.io/data-plane: 'true'
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
    protocol: TCP
---
