apiVersion: v1
kind: Service
metadata:
  name: noeriva-kafka
  namespace: noeriva-system
  labels:
    app.kubernetes.io/name: noeriva-data
    app.kubernetes.io/part-of: noeriva
    app.kubernetes.io/component: kafka
    noeriva.io/data-plane: 'true'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: noeriva-data
    app.kubernetes.io/part-of: noeriva
    app.kubernetes.io/component: kafka
    noeriva.io/data-plane: 'true'
  ports:
  - name: broker
    port: 9092
    targetPort: broker
    protocol: TCP
  - name: controller
    port: 9093
    targetPort: controller
    protocol: TCP
  publishNotReadyAddresses: true
---
