apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noeriva-lan
  namespace: noeriva-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noeriva-console
                port: {name: http}
