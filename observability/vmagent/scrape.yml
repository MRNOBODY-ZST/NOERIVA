global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: noeriva-control
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password_file: /etc/vmagent/metrics-password
    static_configs:
      - targets: ["control:8080"]
  - job_name: noeriva-worker
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password_file: /etc/vmagent/metrics-password
    static_configs:
      - targets: ["worker:8080"]
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
