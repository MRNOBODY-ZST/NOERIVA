spring:
  application:
    name: noeriva-control
  profiles:
    default: demo
  reactor:
    context-propagation: auto
  http:
    codecs:
      max-in-memory-size: 2MB
server:
  port: 8080
  shutdown: graceful
  netty:
    connection-timeout: 5s
    idle-timeout: 60s
spring.lifecycle.timeout-per-shutdown-phase: 25s
management:
  endpoints.web.exposure.include: health,prometheus,info
  endpoint:
    health:
      probes.enabled: true
      show-details: never
  metrics.distribution.percentiles-histogram.http.server.requests: true
  otlp.tracing.export.enabled: false
  otlp.metrics.export.enabled: false
noeriva:
  events-topic: noeriva.events.v1
  clickhouse-url: ${NOERIVA_CLICKHOUSE_URL:http://localhost:18123}
  metrics-url: ${NOERIVA_METRICS_URL:http://localhost:18428}
  organization-id: ${NOERIVA_ORGANIZATION_ID:default}
