name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend verification
        run: ./mvnw -B verify
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: frontend/noeriva-console/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/noeriva-console/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: frontend/noeriva-console
        run: pnpm install --frozen-lockfile
      - name: Frontend unit tests and production build
        working-directory: frontend/noeriva-console
        run: |
          pnpm test
          pnpm build
      - name: Browser tests against the real demo API
        working-directory: frontend/noeriva-console
        run: |
          pnpm exec playwright install --with-deps chromium
          java -jar ../../services/noeriva-control/target/noeriva-control-0.1.0-SNAPSHOT.jar --spring.profiles.active=demo --server.address=127.0.0.1 > /tmp/noeriva-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null
          pnpm test:e2e
      - name: Build OCI images without publishing
        run: |
          docker build -f deploy/docker/Dockerfile.control -t noeriva/control:ci .
          docker build -f deploy/docker/Dockerfile.console -t noeriva/console:ci .
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v4.2.4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.36.4
      - name: Helm lint and all optional template branches
        run: |
          helm lint deploy/helm/noeriva -f deploy/helm/noeriva/ci-values.yaml --strict
          helm template noeriva deploy/helm/noeriva -f deploy/helm/noeriva/ci-values.yaml > /tmp/noeriva.yaml
          helm template noeriva deploy/helm/noeriva -f deploy/helm/noeriva/ci-values.yaml --set ingress.enabled=true --set ingress.className=example --set ingress.host=noeriva.example.invalid --set ingress.tlsSecretName=example-tls --set control.autoscaling.enabled=false > /tmp/noeriva-ingress.yaml
          helm template noeriva deploy/helm/noeriva -f deploy/helm/noeriva/ci-values.yaml --set worker.enabled=false > /tmp/noeriva-no-worker.yaml
          kubectl kustomize deploy/kubernetes/namespaces > /tmp/noeriva-namespaces.yaml
      - name: Validate Compose without exposing values
        env:
          NOERIVA_DB_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_DB_ROOT_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_REDIS_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_CLICKHOUSE_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_BOOTSTRAP_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_COLLECTOR_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_GRAFANA_PASSWORD: ci-placeholder-not-a-secret
          NOERIVA_METRICS_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose -f deploy/compose/compose.yaml --profile observability config --quiet
